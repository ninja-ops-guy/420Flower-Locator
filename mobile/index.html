<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Compass — Nearest Dispensary</title>
    <meta
      name="description"
      content="Compass points toward the nearest cannabis dispensary using OpenStreetMap data. No account, no tracking, foreground location only."
    />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Compass" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121311'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23ebe8e0' stroke-width='2.5'/%3E%3Cpath d='M32 13 L37 32 L32 36 L27 32 Z' fill='%2362d394'/%3E%3Cpath d='M32 36 L35 39 L32 51 L29 39 Z' fill='%239a958b'/%3E%3Ccircle cx='32' cy='34' r='2.6' fill='%23ebe8e0'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("compass.settings.v1") || "{}");
          var t = s.theme === "light" || s.theme === "dark" ? s.theme : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#121311" : "#f4f1e9");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
