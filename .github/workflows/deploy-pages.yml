name: Deploy COMPASS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dispensary-compass-app-specification/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispensary-compass-app-specification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dispensary-compass-app-specification/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dispensary-compass-app-specification/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify public application
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ninja-ops-guy.github.io/420Flower-Locator/"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error --location --max-time 15 "$URL" || true)"
            if printf '%s' "$body" | grep -q "Compass — Nearest Dispensary Finder"; then
              echo "Public COMPASS smoke test passed."
              exit 0
            fi
            echo "Attempt $attempt: deployment not visible yet; retrying..."
            sleep 10
          done
          echo "Public COMPASS smoke test failed."
          exit 1

# deployment generation: 2
